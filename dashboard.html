<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMTG - Système de Management et de Traçabilité Globale</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0b131a;
            --sidebar-bg: #070c10;
            --card-bg: #111b24;
            --card-border: rgba(16, 185, 129, 0.15);
            --primary-glow: #10b981;
            --danger-glow: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #8a99ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        .app {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* --- SIDEBAR STYLING --- */
        .sidebar {
            width: 270px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .sidebar-logo-box {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.05));
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-glow);
            font-size: 18px;
        }

        .sidebar-brand h2 {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .sidebar-brand span {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .sidebar-nav {
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow-y: auto;
            flex: 1;
            max-height: calc(100vh - 140px);
        }

        .sidebar-nav::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-nav::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-glow);
        }

        .nav-link.active {
            border-left: 3px solid var(--primary-glow);
            border-radius: 0 8px 8px 0;
        }

        /* Pages sans permission : invisibles et non cliquables */
        .nav-link.permission-hidden {
            display: none !important;
            pointer-events: none !important;
        }

        .nav-link i {
            font-size: 13px;
            width: 16px;
            text-align: center;
        }

        /* --- MAIN CONTENT AREA --- */
        .main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
        }

        /* --- TOP NAVBAR --- */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 10px 18px;
            border-radius: 12px;
            flex-shrink: 0;
            position: relative;
            z-index: 50;
        }

        .top-nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn-top {
            width: 34px;
            height: 34px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            cursor: pointer;
            position: relative;
            transition: 0.2s;
        }

        .icon-btn-top:hover {
            border-color: var(--primary-glow);
            color: var(--primary-glow);
        }

        .notification-badge-dot {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger-glow);
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 10px;
            display: none;
        }

        /* --- USER PROFILE WRAPPER & DROPDOWN --- */
        .user-profile-wrapper {
            position: relative;
        }

        .user-profile-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            padding: 4px 10px 4px 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .user-profile-pill:hover {
            border-color: var(--primary-glow);
        }

        .user-avatar-box {
            width: 28px;
            height: 28px;
            background: var(--primary-glow);
            color: #000;
            font-weight: 700;
            font-size: 11px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-info-text h4 {
            font-size: 11px;
            color: #fff;
        }

        .user-info-text span {
            font-size: 9px;
            color: var(--text-muted);
        }

        .user-dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            width: 180px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 1000;
            overflow: hidden;
        }

        .user-dropdown-menu a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 11px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.2s;
        }

        .user-dropdown-menu a:hover {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-glow);
        }

        .user-dropdown-menu a:last-child {
            border-bottom: none;
            color: var(--danger-glow);
        }

        /* --- FOOTER STATUS BAR --- */
        .footer-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 10px;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-top: 15px;
        }
        .status-indicators {
            display: flex;
            gap: 15px;
        }
        .status-dot-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .dot-green { width: 6px; height: 6px; background: #10b981; border-radius: 50%; box-shadow: 0 0 6px #10b981; }
    </style>
</head>

        <!-- FOOTER STATUS BAR -->

<!-- LIVE CLOCK -->
<script>
    function initHeaderClock() {
        const dateSpan = document.getElementById('headerDate');
        const clockSpan = document.getElementById('headerClock');
        if (!dateSpan || !clockSpan) return;
        function update() {
            const now = new Date();
            const optionsDate = { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' };
            let formattedDate = now.toLocaleDateString('fr-FR', optionsDate);
            formattedDate = formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1);
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            dateSpan.textContent = formattedDate;
            clockSpan.textContent = `${hours}:${minutes}:${seconds} • GMT+1`;
        }
        update();
        setInterval(update, 1000);
    }
    document.addEventListener('DOMContentLoaded', initHeaderClock);
</script>

<!-- DYNAMIC SIDEBAR + SPA ROUTER + PERMISSIONS -->
<script type="module">
import supabase from './assets/js/core/supabase.js';

import {
    canAccessPage,
    applyDeletePermissionsUI
} from './assets/js/core/permissions-page.js';

document.addEventListener('DOMContentLoaded', () => {

    const mainScreen =
        document.getElementById('main-screen-content');

    const sidebarContainer =
        document.getElementById('dynamicSidebarPages');

    const searchInput =
        document.getElementById('sidebarSearchInput');

    if (!mainScreen || !sidebarContainer) {
        console.error('Éléments Dashboard introuvables.');
        return;
    }

    /* =========================================================
       UTILITAIRES
       ========================================================= */

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function getModuleIcon(moduleName) {
        const m = String(moduleName || '').toUpperCase();

        if (m.includes('TABLEAUX')) return 'fa-chart-pie';
        if (m.includes('STOCK')) return 'fa-boxes-stacked';
        if (m.includes('COMMANDES')) return 'fa-file-invoice';
        if (m.includes('ACHAT')) return 'fa-cart-shopping';
        if (m.includes('PRODUCTION')) return 'fa-industry';
        if (m.includes('INFRASTRUCTURE')) return 'fa-warehouse';
        if (m.includes('EXPÉDITION')) return 'fa-truck';
        if (m.includes('LOGISTIQUE')) return 'fa-route';
        if (m.includes('QUALITÉ')) return 'fa-shield-halved';
        if (m.includes('MAINTENANCE')) return 'fa-screwdriver-wrench';
        if (m.includes('CONTRÔLE')) return 'fa-clipboard-check';
        if (m.includes('ADMIN')) return 'fa-user-shield';

        return 'fa-file-lines';
    }

    function cleanPageName(pageFile) {
        return String(pageFile || '')
            .split('?')[0]
            .split('#')[0]
            .split('/')
            .pop()
            .replace(/\.html$/i, '')
            .trim();
    }

    async function waitPermissions(timeout = 15000) {
        if (window.permissionsLoaded === true) {
            return true;
        }

        const start = Date.now();

        while (window.permissionsLoaded !== true) {
            if (Date.now() - start >= timeout) {
                return false;
            }

            await new Promise(resolve => setTimeout(resolve, 100));
        }

        return true;
    }

    /* =========================================================
       CSS DES PAGES DYNAMIQUES
       ========================================================= */

    function cleanPageCss(css) {
        return String(css || '')
            .replace(
                /html\s*,\s*body\s*\{/gi,
                '#main-screen-content {'
            )
            .replace(
                /body\s*\{/gi,
                '#main-screen-content {'
            )
            .replace(
                /body\s*\[([^\]]+)\]\s*\{/gi,
                '#main-screen-content[$1] {'
            );
    }

    function loadPageStyles(doc) {
        document
            .querySelectorAll('style[data-dynamic-page-style]')
            .forEach(style => style.remove());

        doc.querySelectorAll('head style').forEach(oldStyle => {
            const style = document.createElement('style');

            style.dataset.dynamicPageStyle = 'true';

            style.textContent =
                cleanPageCss(
                    oldStyle.textContent || ''
                );

            document.head.appendChild(style);
        });
    }

    function resolveAsset(src, pageFile) {
        if (!src) return '';

        if (/^(https?:|data:|blob:|\/)/i.test(src)) {
            return src;
        }

        return new URL(
            src,
            new URL(pageFile, window.location.href)
        ).href;
    }

    async function executePageScripts(doc, pageFile) {

        for (
            const oldScript of
            Array.from(doc.querySelectorAll('script'))
        ) {

            const script =
                document.createElement('script');

            script.type =
                oldScript.type ||
                'text/javascript';

            if (oldScript.src) {

                let src =
                    oldScript.getAttribute('src');

                if (
                    src.includes(
                        'admin-dashboard-controller.js'
                    ) ||
                    src.includes('admin-dashboard')
                ) {

                    src =
                        './assets/js/core/admin-dashboard-controller.js';

                } else if (
                    src.includes(
                        'stock-dashboard-controller.js'
                    )
                ) {

                    src =
                        './assets/js/core/stock-dashboard-controller.js';

                } else {

                    src =
                        resolveAsset(
                            src,
                            pageFile
                        );
                }

                script.src = src;

            } else {

                script.textContent =
                    oldScript.textContent || '';
            }

            document.body.appendChild(script);

            if (script.src) {

                await new Promise(resolve => {

                    script.addEventListener(
                        'load',
                        resolve,
                        { once: true }
                    );

                    script.addEventListener(
                        'error',
                        resolve,
                        { once: true }
                    );
                });
            }
        }
    }

    /* =========================================================
       ACCÈS REFUSÉ
       ========================================================= */

    function showAccessDenied(pageFile) {

        const name =
            String(pageFile || '')
                .split('?')[0]
                .split('#')[0]
                .split('/')
                .pop();

        mainScreen.innerHTML = `
            <div style="
                width:100%;
                min-height:250px;
                display:flex;
                align-items:center;
                justify-content:center;
                padding:40px;
            ">
                <div style="
                    width:100%;
                    max-width:650px;
                    background:var(--card-bg);
                    border:1px solid rgba(239,68,68,.35);
                    border-radius:12px;
                    padding:55px 30px;
                    text-align:center;
                ">
                    <div style="
                        width:56px;
                        height:56px;
                        margin:0 auto 16px;
                        border-radius:14px;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        background:rgba(239,68,68,.10);
                        color:var(--danger-glow);
                        font-size:24px;
                    ">
                        <i class="fas fa-lock"></i>
                    </div>

                    <div style="
                        color:var(--text-main);
                        font-size:15px;
                        font-weight:700;
                        margin-bottom:8px;
                    ">
                        Accès refusé
                    </div>

                    <div style="
                        color:var(--text-muted);
                        font-size:11px;
                        line-height:1.7;
                    ">
                        Vous n'avez pas les permissions nécessaires
                        pour accéder à cette page.
                    </div>

                    <div style="
                        color:var(--text-muted);
                        font-size:10px;
                        margin-top:12px;
                    ">
                        Page : ${escapeHtml(name || 'inconnue')}
                    </div>
                </div>
            </div>
        `;
    }

    /* =========================================================
       CHARGEMENT D'UNE PAGE
       ========================================================= */

    async function loadPage(pageFile, linkElement = null) {

        if (!pageFile) {
            return;
        }

        const ready =
            await waitPermissions();

        if (
            !ready ||
            !canAccessPage(pageFile)
        ) {

            if (linkElement) {
                linkElement.classList.remove('active');
            }

            showAccessDenied(pageFile);
            return;
        }

        sidebarContainer
            .querySelectorAll('.nav-link.active')
            .forEach(link => {
                link.classList.remove('active');
            });

        if (linkElement) {
            linkElement.classList.add('active');
        }

        mainScreen.innerHTML = `
            <div style="
                text-align:center;
                color:var(--text-muted);
                padding:50px;
                font-size:12px;
            ">
                Chargement en cours...
            </div>
        `;

        try {

            const path =
                pageFile.startsWith('/')
                    ? pageFile.substring(1)
                    : pageFile;

            const response =
                await fetch(
                    path,
                    {
                        cache: 'no-cache'
                    }
                );

            if (!response.ok) {
                throw new Error(
                    `Erreur HTTP ${response.status}`
                );
            }

            const html =
                await response.text();

            const doc =
                new DOMParser()
                    .parseFromString(
                        html,
                        'text/html'
                    );

            loadPageStyles(doc);

            const content =
                doc.querySelector('main') ||
                doc.body;

            mainScreen.innerHTML =
                content.innerHTML;

            applyDeletePermissionsUI(
                window.currentUserRoleCode
            );

            await executePageScripts(
                doc,
                path
            );

            document.dispatchEvent(
                new CustomEvent(
                    'dashboardLoaded',
                    {
                        detail: {
                            page: path
                        }
                    }
                )
            );

        } catch (error) {

            console.error(
                'Erreur Router Fetch:',
                error
            );

            mainScreen.innerHTML = `
                <div style="
                    color:var(--danger-glow);
                    text-align:center;
                    padding:50px;
                    font-size:12px;
                ">
                    Erreur : Impossible de charger
                    la page (${escapeHtml(pageFile)}).
                    <br>
                    <small>
                        ${escapeHtml(error.message || '')}
                    </small>
                </div>
            `;
        }
    }

    /*
     * Exposer le router pour les liens créés dynamiquement.
     */
    window.loadDynamicPage = loadPage;

    /* =========================================================
       SIDEBAR DEPUIS public.pages
       ========================================================= */

    async function loadPagesFromDatabase() {

        try {

            const {
                data,
                error
            } = await supabase
                .from('pages')
                .select(`
                    id,
                    code,
                    nom,
                    url,
                    module,
                    ordre_affichage,
                    actif,
                    show_in_menu
                `)
                .eq('actif', true)
                .eq('show_in_menu', true)
                .order(
                    'ordre_affichage',
                    {
                        ascending: true
                    }
                );

            if (error) {
                throw error;
            }

            renderSidebar(
                Array.isArray(data)
                    ? data
                    : []
            );

        } catch (error) {

            console.error(
                'Erreur chargement public.pages:',
                error
            );

            sidebarContainer.innerHTML = `
                <div style="
                    padding:15px;
                    color:var(--danger-glow);
                    font-size:10px;
                    text-align:center;
                ">
                    Impossible de charger le menu.
                </div>
            `;
        }
    }

    function renderSidebar(pages) {

        sidebarContainer.innerHTML = '';

        /*
         * Les pages sont regroupées par module,
         * tout en conservant ordre_affichage.
         */

        const groups = new Map();

        pages.forEach(page => {

            const moduleName =
                String(
                    page.module ||
                    'AUTRES'
                ).trim();

            if (!groups.has(moduleName)) {
                groups.set(
                    moduleName,
                    []
                );
            }

            groups
                .get(moduleName)
                .push(page);
        });

        groups.forEach(
            (modulePages, moduleName) => {

                const group =
                    document.createElement('div');

                group.className =
                    'sidebar-page-group';

                const title =
                    document.createElement('div');

                title.className =
                    'sidebar-module-title';

                title.textContent =
                    moduleName;

                title.style.cssText = `
                    padding:10px 12px 5px;
                    color:#64748b;
                    font-size:8px;
                    font-weight:700;
                    text-transform:uppercase;
                    letter-spacing:.7px;
                `;

                group.appendChild(title);

                modulePages.forEach(page => {

                    const link =
                        document.createElement('a');

                    link.href = '#';

                    link.className =
                        'nav-link';

                    link.dataset.page =
                        page.url;

                    link.dataset.pageId =
                        String(page.id);

                    link.dataset.pageCode =
                        page.code || '';

                    link.innerHTML = `
                        <i class="fas ${getModuleIcon(page.module)}"></i>
                        <span>${escapeHtml(page.nom)}</span>
                    `;

                    /*
                     * Une page sans permission :
                     * invisible + non cliquable.
                     */

                    const allowed =
                        canAccessPage(
                            page.url
                        );

                    if (!allowed) {

                        link.classList.add(
                            'permission-hidden'
                        );

                        link.style.display =
                            'none';

                    }

                    link.addEventListener(
                        'click',
                        async event => {

                            event.preventDefault();

                            if (
                                link.classList.contains(
                                    'permission-hidden'
                                ) ||
                                !canAccessPage(
                                    page.url
                                )
                            ) {
                                return;
                            }

                            await loadPage(
                                page.url,
                                link
                            );
                        }
                    );

                    group.appendChild(link);
                });

                sidebarContainer.appendChild(group);
            }
        );

        initSidebarSearch();
    }

    /* =========================================================
       RECHERCHE MENU
       ========================================================= */

    function initSidebarSearch() {

        if (!searchInput) {
            return;
        }

        /*
         * Éviter de créer plusieurs listeners.
         */
        if (
            searchInput.dataset.dynamicSearchReady === 'true'
        ) {
            return;
        }

        searchInput.dataset.dynamicSearchReady =
            'true';

        searchInput.addEventListener(
            'input',
            event => {

                const term =
                    String(
                        event.target.value || ''
                    )
                    .toLowerCase()
                    .trim();

                sidebarContainer
                    .querySelectorAll(
                        '.nav-link[data-page]'
                    )
                    .forEach(link => {

                        if (
                            link.classList.contains(
                                'permission-hidden'
                            )
                        ) {

                            link.style.display =
                                'none';

                            return;
                        }

                        const text =
                            link.textContent
                                .toLowerCase();

                        link.style.display =
                            !term ||
                            text.includes(term)
                                ? 'flex'
                                : 'none';
                    });

                /*
                 * Cacher les titres de modules
                 * qui n'ont aucun lien visible.
                 */
                sidebarContainer
                    .querySelectorAll(
                        '.sidebar-page-group'
                    )
                    .forEach(group => {

                        const visibleLinks =
                            Array.from(
                                group.querySelectorAll(
                                    '.nav-link[data-page]'
                                )
                            )
                            .some(
                                link =>
                                    link.style.display !==
                                    'none'
                            );

                        const title =
                            group.querySelector(
                                '.sidebar-module-title'
                            );

                        if (title) {
                            title.style.display =
                                visibleLinks
                                    ? 'block'
                                    : 'none';
                        }
                    });
            }
        );
    }

    /* =========================================================
       ACTUALISER LES PERMISSIONS DU MENU
       ========================================================= */

    function refreshSidebarPermissions() {

        sidebarContainer
            .querySelectorAll(
                '.nav-link[data-page]'
            )
            .forEach(link => {

                const allowed =
                    canAccessPage(
                        link.dataset.page
                    );

                link.classList.toggle(
                    'permission-hidden',
                    !allowed
                );

                link.style.display =
                    allowed
                        ? 'flex'
                        : 'none';
            });
    }

    /* =========================================================
       CHARGEMENT INITIAL
       ========================================================= */

    (async function initDashboard() {

        const ready =
            await waitPermissions();

        if (!ready) {

            showAccessDenied(
                'dashboard/dashboard-admin.html'
            );

            return;
        }

        await loadPagesFromDatabase();

        /*
         * Recharger le menu si les permissions
         * changent.
         */

        window.addEventListener(
            'permissionsLoaded',
            async () => {
                await loadPagesFromDatabase();
            }
        );

        window.addEventListener(
            'permissionsUpdated',
            async () => {
                await loadPagesFromDatabase();
            }
        );

        /*
         * Trouver automatiquement la première page
         * autorisée.
         */

        const links =
            Array.from(
                sidebarContainer.querySelectorAll(
                    '.nav-link[data-page]'
                )
            )
            .filter(
                link =>
                    !link.classList.contains(
                        'permission-hidden'
                    )
            );

        const preferred =
            'dashboard/dashboard-admin.html';

        const preferredLink =
            links.find(
                link =>
                    link.dataset.page ===
                    preferred
            );

        if (preferredLink) {

            await loadPage(
                preferred,
                preferredLink
            );

            return;
        }

        /*
         * Sinon première page autorisée.
         */

        const firstAllowed =
            links.find(
                link =>
                    canAccessPage(
                        link.dataset.page
                    )
            );

        if (firstAllowed) {

            await loadPage(
                firstAllowed.dataset.page,
                firstAllowed
            );

            return;
        }

        mainScreen.innerHTML = `
            <div style="
                text-align:center;
                color:var(--text-muted);
                padding:60px;
                font-size:13px;
            ">
                <i class="fas fa-lock"
                   style="
                       font-size:32px;
                       color:var(--danger-glow);
                       margin-bottom:15px;
                       display:block;
                   ">
                </i>

                Aucune page n'est autorisée
                pour votre utilisateur.
            </div>
        `;
    })();

});
</script>
